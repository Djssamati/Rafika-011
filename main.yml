name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate project root
        id: project
        run: |
          f=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found"
            find . -maxdepth 4 -not -path "./.git/*" | head -80
            exit 1
          fi
          dir=$(dirname "$f")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Project root: $dir"
          ls -la "$dir"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
          else
            gradle assembleDebug --no-daemon --stacktrace --console=plain
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ta3biaCamera-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
